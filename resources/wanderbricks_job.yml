resources:
  jobs:
    wanderbricks_daily_report:
      name: "Wanderbricks Daily Booking Report_orig"
      tasks:
        - task_key: run_analysis
          environment_key: Default
          max_retries: 0
          spark_python_task:
            parameters:
              - --catalog_source
              - ${var.catalog_source}
              - --catalog_target
              - ${var.catalog_target}
              - --schema_target
              - ${var.schema_target}
            python_file: ../src/wanderbricks_analysis.py
      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: "America/New_York"
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED