# This is a Declarative Automation Bundle definition for dabs_test.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabs_test
  uuid: 8525e2fd-6013-4e9d-a73d-3d49e7340875

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog_source:
    description: The source catalog to use
  catalog_target:
    description: The target catalog to use
  schema_target:
    description: The target schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://fevm-serverless-stable-tenbosch.cloud.databricks.com
    variables:
      catalog_source: samples
      catalog_target: tenbosch
      schema_target: wanderbricks
  prod:
    mode: production
    workspace:
      host: https://fevm-serverless-stable-tenbosch-prd.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/jeff.tenbosch@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jeff.tenbosch@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_source: samples
      catalog_target: serverless_stable_tenbosch_prd_catalog
      schema_target: wanderbricks
    permissions:
      - user_name: jeff.tenbosch@databricks.com
        level: CAN_MANAGE
